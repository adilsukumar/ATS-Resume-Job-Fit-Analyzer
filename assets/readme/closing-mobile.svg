<svg xmlns="http://www.w3.org/2000/svg" width="640" height="650" viewBox="0 0 640 650" role="img" aria-labelledby="t d"><title id="t">Resume-to-Job Fit Analyzer. Read the words. Understand the match. A small NLP pipeline with inspectable mathematics. Course project for local text comparison.</title><desc id="d">Resume-to-Job Fit Analyzer. Read the words. Understand the match. A small NLP pipeline with inspectable mathematics. Course project for local text comparison. Conceptual document/vector artwork, not an actual resume, a measured match score or a hiring prediction.</desc><style>@keyframes pulse{50%{opacity:.35}}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="54" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="600" >RESUME-TO-JOB FIT / ADIL SUKUMAR</text><text x="30" y="158" font-family="Bahnschrift, Arial, sans-serif" font-size="57" fill="#F8F8F3" font-weight="700" letter-spacing="-1.5">Read the words.</text><text x="30" y="233" font-family="Bahnschrift, Arial, sans-serif" font-size="43" fill="#BCFCF6" font-weight="700" letter-spacing="-1.5">Understand the match.</text><text x="32" y="300" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >A small NLP pipeline with mathematics</text><text x="32" y="334" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#A783F7" font-weight="400" >you can inspect.</text><g transform="translate(430 487) scale(0.76)"><path d="M0 -140V0H180" fill="none" stroke="#40364D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0L115 -119" fill="none" stroke="#BCFCF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M103 -119h12v12" fill="none" stroke="#BCFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="vector"><path d="M0 0L162 -50" fill="none" stroke="#FF4081" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 -56l12 6-6 12" fill="none" stroke="#FF4081" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M45 -46A65 65 0 0 1 62 -19" fill="none" stroke="#F3D962" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="-36" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >θ</text><circle r="6" fill="#A783F7"/><text x="-6" y="39" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#A783F7" font-weight="600" >COSINE SIMILARITY</text></g><text x="32" y="589" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >Explore the vectors. Inspect the assumptions.</text><text x="32" y="632" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#FF4081" font-weight="400" >Course project / local text comparison</text></svg>