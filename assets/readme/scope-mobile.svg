<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="t d"><title id="t">The score is project-specific text similarity. Literal tokenization has limitations. Processing is local, with diagnostic logs that include file paths and progress.</title><desc id="d">The score is project-specific text similarity. Literal tokenization has limitations. Processing is local, with diagnostic logs that include file paths and progress. Conceptual document/vector artwork, not an actual resume, a measured match score or a hiring prediction.</desc><style>@keyframes pulse{50%{opacity:.35}}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="210" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M5 6v33h34M5 39L33 12M5 39l34-13M26 12h7v7M32 24l7 2-3 7" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >TEXT SIMILARITY</text><text x="46" y="120" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >A project-specific numerical comparison,</text><text x="46" y="154" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >not a commercial ATS or a prediction of</text><text x="46" y="188" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >selection.</text><rect x="24" y="237" width="592" height="210" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 259) scale(0.9090909090909091)"><path d="M5 8h34v28H5zM12 17h20M12 26h8M26 26h6" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="286" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >LITERAL TOKENS</text><text x="46" y="345" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >Vocabulary, thresholds and simple</text><text x="46" y="379" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >tokenization influence the result. Meaning</text><text x="46" y="413" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >and context are not fully represented.</text><rect x="24" y="462" width="592" height="210" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 484) scale(0.9090909090909091)"><path d="M4 7h36v27H4zM22 34v8M13 42h18" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="511" font-family="Bahnschrift, Arial, sans-serif" font-size="24" fill="#F3D962" font-weight="600" >LOCAL LOGS</text><text x="46" y="570" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >The pipeline processes files locally and</text><text x="46" y="604" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >writes app_debug.log, including progress</text><text x="46" y="638" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#F8F8F3" font-weight="400" >and file paths.</text></svg>