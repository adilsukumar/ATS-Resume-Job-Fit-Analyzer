<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1040" viewBox="0 0 640 1040" role="img" aria-labelledby="t d"><title id="t">Resume-to-Job Fit Analyzer. An NLP course project using Python, NumPy, TF-IDF and cosine similarity for local PDF or text comparison. Conceptual vectors, not a hiring score.</title><desc id="d">Resume-to-Job Fit Analyzer. An NLP course project using Python, NumPy, TF-IDF and cosine similarity for local PDF or text comparison. Conceptual vectors, not a hiring score. Conceptual document/vector artwork, not an actual resume, a measured match score or a hiring prediction.</desc><style>@keyframes pulse{50%{opacity:.35}}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><text x="32" y="48" font-family="Bahnschrift, Arial, sans-serif" font-size="22" fill="#BCFCF6" font-weight="600" >NLP / FUNDAMENTALS COURSE PROJECT</text><text x="24" y="214" font-family="Bahnschrift, Arial, sans-serif" font-size="121" fill="#F8F8F3" font-weight="700" letter-spacing="-6">RESUME</text><text x="24" y="331" font-family="Bahnschrift, Arial, sans-serif" font-size="121" fill="#FF4081" font-weight="700" letter-spacing="-6">JOB FIT</text><text x="32" y="415" font-family="Bahnschrift, Arial, sans-serif" font-size="42" fill="#BCFCF6" font-weight="600" >Make the overlap visible.</text><text x="32" y="478" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >From document text to TF-IDF vectors</text><text x="32" y="512" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#BCFCF6" font-weight="400" >and a cosine-similarity report.</text><g transform="translate(223 829) scale(1.12)"><path d="M0 -140V0H180" fill="none" stroke="#40364D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0L115 -119" fill="none" stroke="#BCFCF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M103 -119h12v12" fill="none" stroke="#BCFCF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="vector"><path d="M0 0L162 -50" fill="none" stroke="#FF4081" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 -56l12 6-6 12" fill="none" stroke="#FF4081" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M45 -46A65 65 0 0 1 62 -19" fill="none" stroke="#F3D962" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="-36" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >θ</text><circle r="6" fill="#A783F7"/><text x="-6" y="39" font-family="Bahnschrift, Arial, sans-serif" font-size="20" fill="#A783F7" font-weight="600" >COSINE SIMILARITY</text></g><text x="32" y="966" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >PYTHON  /  NUMPY  /  PDF + TEXT</text><text x="32" y="1013" font-family="Bahnschrift, Arial, sans-serif" font-size="21" fill="#A783F7" font-weight="400" >Concept geometry · Inspectable mathematical matching</text></svg>